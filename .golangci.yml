version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  exclusions:
    paths:
      - internal/database/sqlc

formatters:
  enable:
    - gofmt
    - goimports
