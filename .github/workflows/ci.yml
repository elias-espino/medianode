name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test -race -timeout 25m ./...
        env:
          CGO_ENABLED: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Panel web
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test
      # Los tipos del cliente salen de docs/openapi.yaml: si cambia la API sin
      # regenerarlos, esto falla en lugar de dejar al panel con tipos viejos.
      - name: Tipos de la API al día
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  cross-build:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Los binarios incrustan el panel compilado en el paso anterior.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Compilación cruzada sin CGO
        run: make cross

  # La imagen se construye y arranca de verdad: el Dockerfile se niega a
  # terminar si el FFmpeg de Alpine no trae ffprobe y libx264, o si es nonfree.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t medianode:ci --build-arg VERSION=ci .
      - name: Arrancarla y comprobar su estado
        run: |
          docker run -d --name medianode -p 8420:8420 medianode:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8420/health
          curl -fsS http://127.0.0.1:8420/api/v1/server/capabilities
          docker logs medianode

  # Fase 13: el servidor de verdad, con un punto de control DLNA (SSDP, Browse,
  # rangos y MPEG-TS) y un reverse proxy simulado que prueba el acceso remoto.
  netcheck:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: FFmpeg y vídeos de prueba
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          go run ./scripts/gen-fixtures
      - name: Servidor y comprobaciones de red
        run: |
          mkdir -p "$RUNNER_TEMP/net/config" "$RUNNER_TEMP/net/media"
          go build -o "$RUNNER_TEMP/net/medianode-server" ./cmd/medianode-server
          go build -o "$RUNNER_TEMP/net/netcheck" ./scripts/netcheck
          "$RUNNER_TEMP/net/netcheck" -gen-cert "$RUNNER_TEMP/net/tls"
          cat > "$RUNNER_TEMP/net/config/server.yaml" <<EOF
          server:
            name: "MediaNode CI"
            http_port: 18420
            https_enabled: true
            https_port: 18421
            tls_cert_file: "$RUNNER_TEMP/net/tls/cert.pem"
            tls_key_file: "$RUNNER_TEMP/net/tls/key.pem"
            trusted_proxies: ["127.0.0.1"]
          metadata:
            provider: "none"
          discovery:
            mdns_enabled: false
            dlna_enabled: true
          remote:
            enabled: true
            direct_enabled: true
            public_url: "https://media.example.com"
          EOF
          "$RUNNER_TEMP/net/medianode-server" --config "$RUNNER_TEMP/net/config/server.yaml" > "$RUNNER_TEMP/net/server.log" 2>&1 &
          for i in $(seq 1 60); do grep -q "HTTPS escuchando" "$RUNNER_TEMP/net/server.log" && break; sleep 1; done
          code=$(sed -n 's/.*"codigo":"\([A-Z0-9]*\)".*/\1/p' "$RUNNER_TEMP/net/server.log" | head -1)
          "$RUNNER_TEMP/net/netcheck" -url http://127.0.0.1:18420 -tls-url https://127.0.0.1:18421 \
            -tls-ca "$RUNNER_TEMP/net/tls/cert.pem" -setup-code "$code" \
            -media-dir "$RUNNER_TEMP/net/media" -fixtures testdata/fixtures
      - name: Registro del servidor
        if: failure()
        run: cat "$RUNNER_TEMP/net/server.log"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # sqlc falla si no hay consultas, y estas llegan en la Fase 2.
      - name: Instalar sqlc
        if: hashFiles('queries/*.sql') != ''
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Comprobar código generado
        if: hashFiles('queries/*.sql') != ''
        run: sqlc diff
