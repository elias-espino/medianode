name: Bug report / Informe de error
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect? / Qué pasó y qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MediaNode version or commit / Versión o commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS, FFmpeg version, browser or client / Sistema, FFmpeg, navegador o cliente
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Registros
      render: text
      description: Administration > Logs, or the server console. Please check there is nothing private before pasting.
